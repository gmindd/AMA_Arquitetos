# Configuração do painel de administração (Decap CMS).
# Os administradores criam projetos e obras de reabilitação aqui;
# cada entrada vira um ficheiro Markdown no repositório e o site
# é reconstruído automaticamente no deploy.

backend:
  name: git-gateway
  branch: main

locale: pt
media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

collections:
  - name: projetos
    label: Projetos
    label_singular: Projeto
    folder: src/content/projetos
    create: true
    slug: '{{slug}}'
    sortable_fields: [ordem, ano, titulo]
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Tipologia, name: tipologia, widget: string, hint: 'Ex.: Habitação unifamiliar, Reabilitação, Reconversão de espaço' }
      - { label: Local, name: local, widget: string, hint: 'Ex.: Chafé, Viana do Castelo' }
      - { label: Área, name: area, widget: string, hint: 'Ex.: 84 m²' }
      - { label: Ano, name: ano, widget: number, value_type: int }
      - { label: Fotografia de capa, name: capa, widget: image }
      - { label: Galeria, name: galeria, widget: list, field: { label: Imagem, name: imagem, widget: image }, required: false, default: [] }
      - { label: Variação do logótipo na capa, name: variacaoLogo, widget: select, options: ['A/MA', 'A/AM', 'MA/A'], default: 'A/MA' }
      - { label: 'Logótipo branco (fotografia escura)', name: logoClaro, widget: boolean, default: true, hint: 'Desligar para logótipo preto sobre fotografia clara' }
      - { label: Ordem na grelha, name: ordem, widget: number, value_type: int, default: 0 }
      - { label: 'Nota breve (opcional)', name: body, widget: markdown, required: false, hint: 'Duas ou três frases curtas. O projeto é o protagonista.' }

  - name: reabilitacao
    label: Reabilitação
    label_singular: Obra de reabilitação
    folder: src/content/reabilitacao
    create: true
    slug: '{{slug}}'
    sortable_fields: [ordem, ano, titulo]
    fields:
      - { label: Título, name: titulo, widget: string, hint: 'Ex.: Tratamento de fachada de prédio' }
      - { label: Local, name: local, widget: string }
      - { label: Ano, name: ano, widget: number, value_type: int }
      - { label: 'Fotografia — antes', name: antes, widget: image }
      - { label: 'Fotografia — depois', name: depois, widget: image }
      - { label: Ordem na lista, name: ordem, widget: number, value_type: int, default: 0 }
      - { label: 'Nota breve (opcional)', name: body, widget: markdown, required: false }
